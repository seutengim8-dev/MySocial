<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10172a">
<title>MySocial 앱 다운로드</title>
<style>
:root{--bg:#0b1020;--panel:#111a2e;--line:#25334f;--text:#edf3ff;--muted:#93a4c2;--blue:#6d8cff;--cyan:#54d6d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 0%,#182747 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
main{width:min(560px,100%);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:22px}
.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#081225;font-weight:950;font-size:25px}
h1{margin:18px 0 6px}p{color:var(--muted)}.button{display:block;text-align:center;margin:22px 0 12px;padding:14px 18px;border-radius:13px;background:linear-gradient(120deg,var(--blue),#8b72f4);color:white;text-decoration:none;font-weight:800}
.note{padding:13px;border:1px solid var(--line);border-radius:12px;background:#0d1629;color:var(--muted);font-size:13px}
a.back{color:var(--cyan);text-decoration:none}
</style>
</head>
<body>
<main>
<div class="logo">M</div>
<h1>MySocial Android 앱</h1>
<p>Android 휴대폰에 APK를 다운로드해 설치할 수 있어.</p>
<a class="button" href="/downloads/mysocial.apk" download>⬇ APK 다운로드</a>
<div class="note">
<strong>설치 안내</strong><br>
1. 다운로드한 APK 파일을 열어.<br>
2. Android에서 안내하는 설치 절차를 진행해.<br>
3. 설치가 끝나면 홈 화면에서 MySocial을 실행해.<br><br>
기기에 따라 브라우저에서 다운로드한 앱 설치를 허용하라는 안내가 표시될 수 있어.
</div>
<p><a class="back" href="/">← MySocial 홈으로</a></p>
</main>
</body>
</html>
